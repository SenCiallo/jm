name: JMComic Daily Sign-in

# 每日自动签到（每天跑两次：主任务 + 30 分钟后的兜底重试）
# 注意：GitHub Actions 的 cron 使用 UTC 时间，北京时间 = UTC + 8
#   0 22 * * *  ->  北京时间 06:00
#  30 22 * * *  ->  北京时间 06:30（此时若已签到，脚本按“今日已签到”成功退出）
on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅登录并查询签到状态，不执行打卡'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

# 同一时间只保留一个签到任务，避免并发重复请求
concurrency:
  group: jmcomic-daily-signin
  cancel-in-progress: false

jobs:
  signin:
    name: Sign in to JMComic
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      # 可选：自定义 API 域名（Repository variable），留空则使用 jmcomic 内置域名
      JM_API_DOMAINS: ${{ vars.JM_API_DOMAINS }}
      # 可选：代理（Repository secret）
      JM_PROXY: ${{ secrets.JM_PROXY }}
      JM_RETRY_TIMES: '3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "${JM_USERNAME}" ] || [ -z "${JM_PASSWORD}" ]; then
            echo "::error::未配置 JM_USERNAME / JM_PASSWORD，请在 Settings -> Secrets and variables -> Actions 中添加"
            exit 2
          fi
          echo "凭据已配置：账号 = ${JM_USERNAME:0:2}***"

      - name: Run daily sign-in
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python signin.py --dry-run
          else
            python signin.py
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-log-${{ github.run_id }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
